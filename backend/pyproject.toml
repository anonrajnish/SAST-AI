# Tooling configuration only (ruff, mypy). Dependencies are managed via requirements*.txt
# per ARCHITECTURE_v2.3 §4. This file does not declare project dependencies.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
# Repo root so backend can resolve the eval harness contract (eval.harness.*),
# which the deterministic analyzers produce Findings for.
mypy_path = ".."
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
# Alembic migration scripts are not strictly typed (generated / DSL-heavy).
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
